{% extends 'base.html' %}
{% block content %}

<div class="max-w-lg mx-auto">

    <form method="post" class="mt-5">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="mb-4 rounded-md bg-red-100 text-red-700 px-3 py-2">
                {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="id_username">
            Email
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-700 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white"
               id="id_username" name="username" type="email" autofocus required
               value="{{ form.username.value|default:'' }}">

        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="id_password">
            Password
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-700 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white"
               id="id_password" name="password" type="password" required>

        <button type='submit' class="w-full text-white bg-blue-500 hover:bg-blue-600 px-3 py-2 rounded-md">
            Login
        </button>
    </form>
</div>

{% endblock content %}
